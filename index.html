<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#efe9df" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)">
<meta name="description" content="A tactile digital soroban (Japanese abacus): free play, satisfying feel and sound, and a guided tutor.">
<title>Soroban</title>
<script>
/* Theme bootstrap: resolve saved theme before first paint to avoid a flash.
   Runs before CSS applies; safe if storage throws (WebView previews). */
(function(){
  var t = 'auto';
  try { var s = JSON.parse(localStorage.getItem('soroban.settings')||'{}'); if (s.theme) t = s.theme; } catch(e){}
  if (t === 'auto') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
/* ============================================================ UI CHROME
   These variables style the app shell (toolbar, panels, tutor bar).
   The abacus itself is styled by the SKINS registry in JS (SVG paints). */
:root {
  --bg:#efe9df; --bg2:#e4dccd; --fg:#2b241a; --fg-dim:#6b6154;
  --panel:#f8f5ee; --panel-edge:#d8cfc0; --control:#efe9dd; --control-edge:#c9bfae;
  --accent:#a85a20; --accent-fg:#ffffff; --focus:#1d5fd0;
  --good:#1d7a3e; --bad:#b3342e; --hint:#8a5a12;
  --shadow:0 10px 30px rgba(40,30,15,.18);
  --tutor-bg:#fdf9f0; --tutor-edge:#e0d5c0;
}
html[data-theme="dark"] {
  --bg:#17140f; --bg2:#100e0a; --fg:#ece5d8; --fg-dim:#a49a89;
  --panel:#221e17; --panel-edge:#3a342a; --control:#2b261e; --control-edge:#4a4234;
  --accent:#d98b45; --accent-fg:#1c1710; --focus:#7fb0ff;
  --good:#5cc07f; --bad:#ee7b74; --hint:#e0b45e;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --tutor-bg:#241f16; --tutor-edge:#463d2c;
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body {
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background:var(--bg); color:var(--fg);
  overflow:hidden; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
#app {
  height:100%; display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ---- Top bar ---- */
#topbar {
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:8px 12px; min-height:52px;
}
#appTitle { font-weight:700; font-size:17px; letter-spacing:.02em; margin-right:2px; }
#readout {
  flex:1 1 auto; min-width:0; text-align:center;
  font-variant-numeric:tabular-nums; font-weight:650;
  font-size:clamp(20px, 4.5vw, 34px); line-height:1.1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#readout[hidden] { display:none; }
#readout .dg { display:inline-block; }
#readout .dg.in { animation:dgin .18s ease-out; }
@keyframes dgin { from { transform:translateY(-.35em); opacity:0; } to { transform:none; opacity:1; } }
#topbtns { display:flex; gap:8px; margin-left:auto; }

/* ---- Buttons & controls ---- */
button {
  font:inherit; color:var(--fg); background:var(--control);
  border:1px solid var(--control-edge); border-radius:10px;
  min-height:44px; min-width:44px; padding:8px 14px;
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  transition:background .12s ease, transform .06s ease;
}
button:active { transform:scale(.97); }
button.primary { background:var(--accent); color:var(--accent-fg); border-color:transparent; font-weight:650; }
button.icon { padding:8px; }
button svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
button[aria-pressed="false"] .on-only { display:none; }
button[aria-pressed="true"] .off-only { display:none; }
select, input[type="number"], input[type="text"] {
  font:inherit; color:var(--fg); background:var(--control);
  border:1px solid var(--control-edge); border-radius:8px; min-height:40px; padding:6px 10px;
}
input[type="range"] { width:100%; accent-color:var(--accent); min-height:32px; }
:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }

/* ---- Stage / abacus ---- */
#stage {
  flex:1 1 auto; min-height:0; position:relative;
  display:flex; align-items:center; justify-content:center;
}
#abacusWrap {
  max-width:100%; max-height:100%; overflow-x:auto; overflow-y:hidden;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
  border-radius:18px;
}
#abacusWrap::-webkit-scrollbar { display:none; }
#abacus { display:block; touch-action:pan-x; }
/* Beads and their hit zones own their gestures completely. */
#abacus .bead-hit, #abacus .bead { touch-action:none; cursor:grab; }
#abacus .bead-hit:active { cursor:grabbing; }
#abacus .rodgroup:focus { outline:none; }
#abacus .rodgroup:focus-visible .rod-focus { opacity:1; }
#abacus .rod-focus {
  opacity:0; fill:none; stroke:var(--focus); stroke-width:3; rx:10;
  pointer-events:none; transition:opacity .1s;
}
#abacus .unit-dot { cursor:pointer; }
#abacus .bead-g { will-change:transform; }
#abacus .bead-g.snap { transition:transform var(--snap-ms,120ms) cubic-bezier(.17,.84,.44,1); }
#abacus .tutor-glow { pointer-events:none; }
#abacus .tutor-arrow { pointer-events:none; }
@keyframes tglow { 0%,100% { opacity:.55; } 50% { opacity:1; } }
#abacus .tutor-glow ellipse, #abacus .tutor-arrow { animation:tglow 1.2s ease-in-out infinite; }
@keyframes shakex { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
#abacusWrap.shake { animation:shakex .28s ease-in-out 2; }

/* ---- Tutor bar ---- */
#tutorBar {
  background:var(--tutor-bg); border-top:1px solid var(--tutor-edge);
  padding:10px 14px; display:flex; flex-direction:column; gap:8px;
}
#tutorBar[hidden] { display:none; }
#tutorTop { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
#tutorProblem { font-size:clamp(18px,3.5vw,26px); font-weight:700; font-variant-numeric:tabular-nums; }
#tutorProgress { color:var(--fg-dim); font-size:14px; margin-left:auto; white-space:nowrap; }
#tutorMsg { font-size:15px; line-height:1.45; min-height:1.4em; }
#tutorMsg.err { color:var(--bad); font-weight:600; }
#tutorMsg.ok { color:var(--good); font-weight:600; }
#tutorBtns { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
#tutorBtns button { min-height:40px; padding:6px 12px; }
#freeForm { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
#freeForm input { width:110px; }
#freeForm[hidden] { display:none; }

/* ---- Settings sheet ---- */
#scrim {
  position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40;
  opacity:1; transition:opacity .2s;
}
#scrim[hidden] { display:none; }
#settings {
  position:fixed; z-index:50; top:0; right:0; bottom:0;
  width:min(360px, 92vw); background:var(--panel);
  border-left:1px solid var(--panel-edge); box-shadow:var(--shadow);
  padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
  overflow-y:auto; transform:translateX(0); transition:transform .22s ease-out;
  display:flex; flex-direction:column; gap:16px;
}
#settings[hidden] { display:none; }
#settings h2 { font-size:18px; display:flex; align-items:center; justify-content:space-between; }
#settings .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
#settings .row > label:first-child { flex:1; }
#settings .col { display:flex; flex-direction:column; gap:6px; }
#settings .seg { display:flex; border:1px solid var(--control-edge); border-radius:10px; overflow:hidden; }
#settings .seg button { border:0; border-radius:0; flex:1; min-height:40px; background:transparent; }
#settings .seg button[aria-pressed="true"] { background:var(--accent); color:var(--accent-fg); font-weight:650; }
#settings hr { border:0; border-top:1px solid var(--panel-edge); }
#settings .note { color:var(--fg-dim); font-size:13px; line-height:1.4; }
.switch { position:relative; width:52px; height:30px; flex:none; }
.switch input { position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; width:100%; height:100%; }
.switch .tr {
  position:absolute; inset:0; border-radius:999px; background:var(--control-edge); transition:background .15s;
  pointer-events:none;
}
.switch .tr::after {
  content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
  background:var(--panel); box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .15s;
}
.switch input:checked + .tr { background:var(--accent); }
.switch input:checked + .tr::after { transform:translateX(22px); }
.switch input:focus-visible + .tr { outline:3px solid var(--focus); outline-offset:2px; }

/* ---- Hints, misc ---- */
#rotateHint {
  position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
  background:var(--panel); border:1px solid var(--panel-edge); border-radius:12px;
  box-shadow:var(--shadow); padding:10px 14px; font-size:14px; z-index:30;
  display:flex; gap:10px; align-items:center; max-width:92%;
}
#rotateHint[hidden] { display:none; }
#rotateHint button { min-height:36px; min-width:36px; padding:4px 10px; }
.visually-hidden {
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

@media (max-width:520px) {
  #appTitle { display:none; }
  #topbar { padding:6px 8px; gap:6px; }
}
@media (prefers-reduced-motion: reduce) {
  #abacus .bead-g.snap { transition-duration:40ms; }
  #readout .dg.in { animation:none; }
  #abacus .tutor-glow ellipse, #abacus .tutor-arrow { animation:none; opacity:.9; }
  #abacusWrap.shake { animation:none; }
  #settings { transition:none; }
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <span id="appTitle">Soroban</span>
    <output id="readout" aria-hidden="true">0</output>
    <div id="topbtns">
      <button id="btnUndo" class="icon" title="Undo (Ctrl+Z)" aria-label="Undo">
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 7 7v1"/></svg>
      </button>
      <button id="btnClear" title="Clear the abacus (Esc)" aria-label="Clear the abacus">Clear</button>
      <button id="btnSound" class="icon" title="Sound on/off" aria-label="Sound" aria-pressed="true">
        <svg viewBox="0 0 24 24" class="on-only"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg viewBox="0 0 24 24" class="off-only"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 5m0-5-5 5"/></svg>
      </button>
      <button id="btnSettings" class="icon" title="Settings" aria-label="Settings" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h.01a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
      </button>
    </div>
  </header>

  <main id="stage">
    <div id="abacusWrap">
      <svg id="abacus" xmlns="http://www.w3.org/2000/svg" role="application"
           aria-label="Soroban abacus. Use arrow keys to move between rods, number keys to set a rod's value."></svg>
    </div>
    <div id="rotateHint" hidden>
      <span>Rotate your device for a better fit with this many rods.</span>
      <button id="rotateHintClose" aria-label="Dismiss hint">OK</button>
    </div>
  </main>

  <section id="tutorBar" hidden aria-label="Tutor">
    <div id="tutorTop">
      <label for="tutorSet" class="visually-hidden">Problem set</label>
      <select id="tutorSet">
        <option value="add1">Addition — simple</option>
        <option value="add5">Addition — 5's complements</option>
        <option value="add10">Addition — 10's complements</option>
        <option value="sub1">Subtraction — simple</option>
        <option value="sub5">Subtraction — 5's complements</option>
        <option value="sub10">Subtraction — 10's complements</option>
        <option value="mixed">Mixed review</option>
        <option value="free">Free practice</option>
      </select>
      <span id="tutorProblem" aria-live="polite"></span>
      <span id="tutorProgress" aria-live="polite"></span>
    </div>
    <div id="freeForm" hidden>
      <input id="freeA" type="text" inputmode="decimal" placeholder="First number" aria-label="First number">
      <select id="freeOp" aria-label="Operation"><option value="+">+</option><option value="-">−</option></select>
      <input id="freeB" type="text" inputmode="decimal" placeholder="Second number" aria-label="Second number">
      <button id="freeGo" class="primary">Start</button>
    </div>
    <div id="tutorMsg" aria-live="polite"></div>
    <div id="tutorBtns">
      <button id="tutorShow">Show me</button>
      <button id="tutorNew">New problem</button>
      <button id="tutorExit">Exit tutor</button>
    </div>
  </section>

  <div id="scrim" hidden></div>
  <aside id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h2><span id="settingsTitle">Settings</span>
      <button id="settingsClose" class="icon" aria-label="Close settings">
        <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </h2>
    <div class="col">
      <label for="setSkin">Skin</label>
      <select id="setSkin"></select>
    </div>
    <div class="col">
      <span id="themeLabel">Theme</span>
      <div class="seg" role="group" aria-labelledby="themeLabel">
        <button data-theme-opt="auto" aria-pressed="false">Auto</button>
        <button data-theme-opt="light" aria-pressed="false">Light</button>
        <button data-theme-opt="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
    <hr>
    <div class="row">
      <label for="setSound">Sound</label>
      <span class="switch"><input type="checkbox" id="setSound"><span class="tr"></span></span>
    </div>
    <div class="col">
      <label for="setVolume">Volume</label>
      <input type="range" id="setVolume" min="0" max="100" step="1">
    </div>
    <div class="col">
      <label for="setMaterial">Sound material</label>
      <select id="setMaterial">
        <option value="auto">Match skin</option>
        <option value="wood">Wood on wood</option>
        <option value="woodMetal">Wood on metal</option>
        <option value="metal">Metal on metal</option>
      </select>
    </div>
    <div class="row" id="hapticsRow">
      <label for="setHaptics">Haptics</label>
      <span class="switch"><input type="checkbox" id="setHaptics"><span class="tr"></span></span>
    </div>
    <hr>
    <div class="col">
      <label for="setRods">Rods</label>
      <select id="setRods"></select>
    </div>
    <div class="row">
      <label for="setReadout">Numeral readout</label>
      <span class="switch"><input type="checkbox" id="setReadout"><span class="tr"></span></span>
    </div>
    <hr>
    <button id="setTutor" class="primary">Start guided tutor</button>
    <p class="note">Tap a dot on the beam to choose the ones column. Two-finger swipe across the frame to clear, like tilting a real soroban. Everything stays on this device — no network, no tracking.</p>
  </aside>

  <div id="live" class="visually-hidden" aria-live="polite"></div>
</div>


<script>
'use strict';
/* =====================================================================
   DIGITAL SOROBAN — single-file app
   =====================================================================
   Where to change things (for future editors):

   • CONFIG        — every tunable constant: bead geometry, animation
                     timings, drag/flick physics thresholds, audio
                     parameters, haptics, and default settings. Change
                     numbers here, not inline in the modules.
   • ABACUS_TYPES  — the abacus layout registry. Bead counts and values
                     per rod are DATA. To add a Chinese suanpan, add an
                     entry (heavenBeads:2, earthBeads:5) — nothing else
                     should need to change. See the comment block above
                     the registry for the full extension procedure.
   • SKINS         — the visual skin registry. Each skin is a data
                     object with a light and a dark palette plus a
                     pointer to its audio material profile. Add a fourth
                     skin by adding an object; the settings UI, the
                     renderer, and the audio hookup pick it up
                     automatically.

   Module order (decoupled; Renderer never mutates State, Audio knows
   nothing about the DOM): CONFIG, ABACUS_TYPES, SKINS, Store, State,
   Renderer, Input, AudioEngine, Haptics, Tutor, Settings, App.
   ===================================================================== */

/* ============================================================ CONFIG */
const CONFIG = {
  geometry: {
    beadW: 58,        // bead width (SVG units)
    beadH: 34,        // bead height = travel step along the rod
    rodSpacing: 72,   // horizontal pitch between rods
    frameSide: 26,    // left/right frame thickness
    frameTopBot: 24,  // top/bottom frame thickness
    barH: 14,         // reckoning-bar height
    minBeadPx: 46,    // if a rod column renders narrower than this many
                      // CSS px, the abacus grows and pans instead
    hitPad: 6,        // extra invisible hit area around each bead (SVG units)
  },
  anim: {
    snapMs: 120,      // release snap duration
    flickSnapMs: 65,  // snap duration after a fast flick
    clearStaggerMs: 14, // per-rod delay in the clear cascade
    showMeMs: 380,    // "show me" tutor animation duration
  },
  physics: {
    commitFraction: 0.5,  // travel past this fraction of the gap commits
    flickVelocity: 0.7,   // px/ms (CSS px) release speed that commits regardless
    tapMaxMovePx: 9,      // pointer travel under this is a tap, not a drag
    tapMaxMs: 400,
    impactMinVel: 0.12,   // px/ms below which a drag contact is silent
    velSmoothing: 0.35,   // EMA factor for velocity tracking
  },
  audio: {
    maxVoices: 12,        // concurrent voices; oldest is stolen
    staggerMs: 7,         // per-bead delay when a stack lands
    humanizePitch: 0.03,  // ±3% random pitch per hit
    humanizeTimeMs: 4,    // ± random scheduling jitter per hit
    masterGain: 0.9,
  },
  haptics: { minMs: 8, maxMs: 15 },
  clearGesture: { minDxPx: 110, maxDurMs: 900 }, // two-finger swipe across frame
  undoDepth: 50,
  rodCounts: [7, 13, 17, 21],
  defaults: {
    rodCount: 13, skin: 'woodWood', theme: 'auto',
    sound: true, volume: 0.8, material: 'auto',
    haptics: true, readout: true,
  },
};

/* ===================================================== ABACUS_TYPES
   ------------------------------------------------------------------
   THE ABACUS LAYOUT IS DATA, NOT CODE.
   Every part of this file — rendering, value computation, tap
   targets, drag clamping, keyboard entry, the tutor's complement
   planner, and the readout — derives bead counts and values from the
   active entry here. Nothing anywhere assumes "1 heaven bead" or
   "4 earth beads"; a dev assertion below fails loudly if that ever
   regresses.

   EXTENSION PROCEDURE — to add a Chinese suanpan (on its own page,
   or by switching the active type):
     1. Add an entry:
          suanpan: { name:'Suanpan', heavenBeads:2, heavenValue:5,
                     earthBeads:5, earthValue:1, beadShape:'rounded' }
     2. Point ACTIVE_ABACUS_TYPE at it (or expose a picker).
   No other code changes should be required. Rod-value capacity, free
   travel gaps, tap/drag group logic, and the tutor's complement rules
   all recompute from these numbers.
   ------------------------------------------------------------------ */
const ABACUS_TYPES = {
  soroban: {
    name: 'Soroban',
    heavenBeads: 1,       // beads above the reckoning bar
    heavenValue: 5,       // value of each heaven bead
    earthBeads: 4,        // beads below the reckoning bar
    earthValue: 1,        // value of each earth bead
    beadShape: 'biconical',
    unitDotEvery: 3,      // unit-dot marker on the bar every Nth rod
  },
  // NOTE: To add a Chinese suanpan, add an entry here with
  // heavenBeads: 2, earthBeads: 5, beadShape: 'rounded'.
  // No other code changes should be required. All rendering,
  // value computation, tap targets, drag clamping, and readout
  // logic must derive from these numbers — never assume 1 and 4.
};
const ACTIVE_ABACUS_TYPE = 'soroban';
const ATYPE = ABACUS_TYPES[ACTIVE_ABACUS_TYPE];
/* Max value one rod can hold (soroban: 9). Everything uses this. */
const ROD_MAX = ATYPE.heavenBeads * ATYPE.heavenValue
              + ATYPE.earthBeads * ATYPE.earthValue;

/* ============================================================= SKINS
   Each skin: bead gradient stops, specular highlight, bead edge, rod
   paint + width, frame paint, reckoning-bar paint, backdrop, unit-dot
   colors, and its audio material profile. Both palettes are designed,
   not derived — dark wood is walnut, dark metal is gunmetal.
   Add a fourth skin by adding an object; no code changes needed.     */
const SKINS = {
  woodWood: {
    name: 'Wood on wood',
    material: 'wood',
    rodWidth: 9,
    light: {
      backdrop: '#e7ddcb',
      frame: ['#a8763e', '#8a5a28', '#6f461d'],
      frameEdge: '#5c3a17',
      bar: ['#7a5122', '#5f3d17'],
      rod: ['#b98d55', '#8f6832'],
      bead: [['0%','#e8b87a'], ['35%','#c98a3e'], ['70%','#a5671f'], ['100%','#7c4a12']],
      beadHi: 'rgba(255,240,210,0.85)',
      beadEdge: 'rgba(70,40,10,0.55)',
      shadow: 'rgba(60,35,10,0.35)',
      dot: '#f5e8d2', dotActive: '#ffd57a',
    },
    dark: {
      backdrop: '#211a12',
